<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trò Chơi Toán Học - Phạm Vi 10</title>
    <style>
        body {
            /* Ưu tiên hiển thị phông chữ VNI-Time, fallback sang Arial hoặc serif */
            font-family: 'VNI-Time', Arial, 'Times New Roman', serif;
            background-color: #e0f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }

        .game-container {
            background-color: #ffffff;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 450px;
            width: 90%;
        }

        h1 {
            color: #00796b;
            font-size: 32px;
            margin-bottom: 20px;
        }

        #question-text {
            font-size: 40px;
            font-weight: bold;
            margin-bottom: 30px;
            color: #d32f2f;
            letter-spacing: 2px; /* Khoảng cách rõ ràng, dễ đọc cho học sinh */
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .option-btn {
            background-color: #f1f8e9;
            border: 2px solid #8bc34a;
            border-radius: 10px;
            padding: 15px;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .option-btn:hover {
            background-color: #c5e1a5;
        }

        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.8;
        }

        .correct {
            background-color: #4caf50 !important;
            color: white;
            border-color: #388e3c;
            transform: scale(1.05);
        }

        .incorrect {
            background-color: #f44336 !important;
            color: white;
            border-color: #d32f2f;
        }

        #next-btn, #restart-btn {
            margin-top: 30px;
            background-color: #0288d1;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 20px;
            border-radius: 10px;
            cursor: pointer;
            display: none;
            font-family: inherit;
            width: 100%;
            transition: background-color 0.2s;
        }

        #next-btn:hover, #restart-btn:hover {
            background-color: #0277bd;
        }

        #score-board {
            display: none;
        }

        .score-text {
            font-size: 28px;
            color: #ef6c00;
            margin-bottom: 20px;
            font-weight: bold;
        }
        
        .feedback-msg {
            font-size: 20px;
            color: #00796b;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div class="game-container">
    <div id="quiz-screen">
        <h1>Bé Giỏi Toán</h1>
        <div id="question-text">Câu hỏi sẽ hiện ở đây</div>
        <div class="options-container" id="options">
            <!-- Các nút lựa chọn sẽ được tạo bằng JavaScript -->
        </div>
        <button id="next-btn" onclick="nextQuestion()">Câu Tiếp Theo</button>
    </div>

    <div id="score-board">
        <h1>Hoàn Thành!</h1>
        <div class="score-text" id="final-score">Bạn đạt: 0 / 5</div>
        <div class="feedback-msg" id="feedback-message"></div>
        <button id="restart-btn" style="display: block;" onclick="restartGame()">Chơi Lại</button>
    </div>
</div>

<script>
    const questions = [
        {
            question: "3 + 4 = ?",
            options: ["6", "7", "8"],
            answer: 1
        },
        {
            question: "8 - 2 = ?",
            options: ["5", "6", "7"],
            answer: 1
        },
        {
            question: "5 + 5 = ?",
            options: ["9", "10", "1"],
            answer: 1
        },
        {
            question: "9 - 4 = ?",
            options: ["4", "5", "6"],
            answer: 1
        },
        {
            question: "2 + 6 = ?",
            options: ["8", "7", "9"],
            answer: 0
        }
    ];

    let currentQuestionIndex = 0;
    let score = 0;

    const questionTextElement = document.getElementById("question-text");
    const optionsContainer = document.getElementById("options");
    const nextButton = document.getElementById("next-btn");
    const quizScreen = document.getElementById("quiz-screen");
    const scoreBoard = document.getElementById("score-board");
    const finalScoreElement = document.getElementById("final-score");
    const feedbackMessageElement = document.getElementById("feedback-message");

    function startGame() {
        currentQuestionIndex = 0;
        score = 0;
        quizScreen.style.display = "block";
        scoreBoard.style.display = "none";
        loadQuestion();
    }

    function loadQuestion() {
        nextButton.style.display = "none";
        optionsContainer.innerHTML = "";
        
        const currentQuestion = questions[currentQuestionIndex];
        questionTextElement.innerText = currentQuestion.question;

        currentQuestion.options.forEach((option, index) => {
            const button = document.createElement("button");
            button.innerText = option;
            button.classList.add("option-btn");
            button.onclick = () => selectAnswer(index, button);
            optionsContainer.appendChild(button);
        });
    }

    function selectAnswer(selectedIndex, selectedButton) {
        const currentQuestion = questions[currentQuestionIndex];
        const allButtons = optionsContainer.children;

        // Vô hiệu hóa tất cả các nút sau khi chọn để tránh click nhiều lần
        for (let i = 0; i < allButtons.length; i++) {
            allButtons[i].disabled = true;
        }

        // Kiểm tra câu trả lời
        if (selectedIndex === currentQuestion.answer) {
            selectedButton.classList.add("correct");
            score++;
        } else {
            selectedButton.classList.add("incorrect");
            // Hiển thị nút có đáp án đúng để bé học hỏi
            allButtons[currentQuestion.answer].classList.add("correct");
        }

        // Hiện nút chuyển câu
        nextButton.style.display = "block";
    }

    function nextQuestion() {
        currentQuestionIndex++;
        
        // Nếu còn câu hỏi thì tải câu tiếp theo, nếu hết thì hiện điểm
        if (currentQuestionIndex < questions.length) {
            loadQuestion();
        } else {
            showScoreBoard();
        }
    }

    function showScoreBoard() {
        quizScreen.style.display = "none";
        scoreBoard.style.display = "block";
        finalScoreElement.innerText = `Bạn đạt: ${score} / ${questions.length}`;
        
        // Hiện thông điệp động viên dựa trên số điểm
        if (score === questions.length) {
            feedbackMessageElement.innerText = "Xuất sắc! Bé là thiên tài toán học!";
        } else if (score >= questions.length / 2) {
            feedbackMessageElement.innerText = "Rất tốt! Cố gắng phát huy nhé!";
        } else {
            feedbackMessageElement.innerText = "Lần sau bé cố gắng hơn nhé!";
        }
    }

    function restartGame() {
        startGame();
    }

    // Bắt đầu game ngay khi tải trang
    window.onload = function() {
        startGame();
    };
</script>
</body>
</html>
